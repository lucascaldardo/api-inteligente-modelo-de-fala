spring:
  application:
    name: api.fala
  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  ai:
    model:
      audio:
        speech: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      audio:
        transcription:
          options:
            model: whisper-1
            language: pt
            temperature: 0
            response-format: text
            prompt: >-
              Audio em portugues brasileiro, audio contem descrição de gastos financeiros.
              As frases geralmente contem:
              - um valor em reais (numero + reais);
              - um ação (gastei, paguei. comprei);
              - um local ou estabelecimento (mercado, farmacia, restaurante, loja, etc...)
        speech:
          options:
            model: gpt-4o-mini-tts
            voice: nova
            speed: 1.2
            response-format: mp3

logging:
  level:
    org.springframework.ai: DEBUG