plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'lucas'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation platform("org.springframework.ai:spring-ai-bom:2.0.0-M4")
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
}

def loadEnv() {
	def envFile = rootProject.file('.env')
	def envVars = [:]
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			def trimmed = line.trim()
			if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
				def (key, value) = trimmed.split('=', 2)
				envVars[key.trim()] = value.trim()
			}
		}
	}
	return envVars
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	environment loadEnv()
	if (System.getenv("OPENAI_API_KEY")) {
		environment "OPENAI_API_KEY", System.getenv("OPENAI_API_KEY")
	}
}

tasks.named('bootRun') {
	environment loadEnv()
	if (System.getenv("OPENAI_API_KEY")) {
		environment "OPENAI_API_KEY", System.getenv("OPENAI_API_KEY")
	}
}

